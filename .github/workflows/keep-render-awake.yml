name: Keep FreelanceChain demo awake

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/keep-render-awake.yml"
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: freelancechain-render-warmup
  cancel-in-progress: true

jobs:
  warm:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Check the public readiness endpoint
        shell: bash
        run: |
          endpoint="https://freelancechain-api-zje1.onrender.com/api/health/ready"
          body_file="$(mktemp)"
          trap 'rm -f "$body_file"' EXIT
          for attempt in 1 2 3 4 5 6; do
            status="$(curl --silent --output "$body_file" --write-out '%{http_code}' --max-time 12 "$endpoint" 2>/dev/null || true)"
            if [ "$status" = "200" ] && grep -q '"status":"ready"' "$body_file"; then
              echo "FreelanceChain API is ready."
              exit 0
            fi
            if [ "$attempt" -lt 6 ]; then sleep 8; fi
          done
          echo "FreelanceChain API did not become ready." >&2
          exit 1
